<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="omc: established in 2026, shipping continuously with 50+ signed releases, one static binary and zero flags">
  <title>omc - established 2026, 50+ signed releases and counting</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef4fd"/>
      <stop offset="1" stop-color="#e7eefb"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.2" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d56f4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7f9cc0" flood-opacity="0.28"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0f172a" opacity="0.055"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1200" height="180" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="180" rx="22" fill="url(#grid)"/>
  <circle cx="120" cy="20" r="260" fill="url(#glowA)"/>
  <circle cx="1140" cy="170" r="240" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1199" height="179" rx="21.5" fill="none" stroke="#bfd4ec"/>
  <rect x="44" y="0" width="620" height="2" fill="url(#edge)"/>

  <g>
    <rect x="44" y="52" width="76" height="76" rx="20" fill="url(#brand)"/>
    <path d="M58 90h48" fill="none" stroke="#04060d" stroke-width="6.4" stroke-linecap="round"/>
    <circle cx="82" cy="90" r="15" fill="#04060d"/>
    <path d="M75.6 90.4l4.6 4.7 8.8-9.7" fill="none" stroke="#67e8f9" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="146" y="68" class="mono" font-size="12" letter-spacing="2.8" fill="#0e7490">ESTABLISHED 2026</text>
  <text x="146" y="103" class="sans" font-size="29" font-weight="800" letter-spacing="-0.9" fill="#0f172a">Release-ready from commit one</text>
  <text x="146" y="131" class="mono" font-size="12.5" fill="#5b6b82">open source &#183; pure Go &#183; no git binary &#183; zero flags</text>

  <g filter="url(#soft)">
    <rect x="792" y="38" width="364" height="104" rx="16" fill="#ffffff" stroke="#d7e3f2"/>
  </g>
  <text x="816" y="66" class="mono" font-size="10.5" letter-spacing="2.4" fill="#64748b">SHIPPING NOW</text>
  <text x="816" y="103" class="mono" font-size="30" font-weight="700" fill="#0f172a">v0.1.54</text>
  <rect x="944" y="82" width="60" height="24" rx="12" fill="#ecfdf3" stroke="#86efac"/>
  <text x="974" y="98.5" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#15803d">SIGNED</text>
  <line x1="816" y1="116" x2="1132" y2="116" stroke="#dbe6f4"/>
  <text x="816" y="133" class="mono" font-size="11.5" fill="#5b6b82">50+ tagged releases &#183; MIT</text>
  <text x="1132" y="133" text-anchor="end" class="mono" font-size="11.5" fill="#0e7490">still one command</text>
</svg>
