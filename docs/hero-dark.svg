<text x="161" y="143" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="4.4" fill="#8b949e">OH-MY-COMMIT</text>

<text x="64" y="206" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="-0.8" fill="#e6edf3">One command. Zero flags.</text>
<text x="64" y="238" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e">Every commit described, signed,</text>
