<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="omc hero banner: one command, zero flags, and a dashboard showing stage, diff, describe, sign, commit, tag and push">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070d"/><stop offset="0.55" stop-color="#0b1020"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#131a26"/><stop offset="1" stop-color="#0b0f16"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0.2" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7d56f4"/><stop offset="1" stop-color="#58a6ff"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7d56f4" stop-opacity="0.38"/><stop offset="1" stop-color="#7d56f4" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#58a6ff" stop-opacity="0.26"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
    <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
  </filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#e6edf3" opacity="0.055"/>
  </pattern>
  <clipPath id="panelClip"><rect x="648" y="64" width="688" height="480" rx="18"/></clipPath>
</defs>

<rect width="1400" height="600" fill="url(#bg)"/>
<rect width="1400" height="600" fill="url(#grid)"/>
<circle cx="140" cy="60" r="430" fill="url(#glowA)"/>
<circle cx="1290" cy="560" r="420" fill="url(#glowB)"/>

