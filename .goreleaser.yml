version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: omc
    main: ./cmd/omc
    binary: omc
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X paepcke.de/omc/internal/version.Version={{.Version}}
    goos:
      - linux
      - darwin
      - freebsd
      - netbsd
      - openbsd
      - dragonfly
      - solaris
      - illumos
    goarch:
      - amd64
      - arm64
      - 386
      - arm
      - ppc64
      - ppc64le
      - mips
      - mipsle
      - mips64
      - mips64le
      - riscv64
      - s390x
      - loong64
    ignore:
      # dragonfly only targets amd64
      - goos: dragonfly
        goarch: arm64
      - goos: dragonfly
        goarch: "386"
      - goos: dragonfly
        goarch: arm
      - goos: dragonfly
        goarch: ppc64
      - goos: dragonfly
        goarch: ppc64le
      - goos: dragonfly
        goarch: mips
      - goos: dragonfly
        goarch: mipsle
      - goos: dragonfly
        goarch: mips64
      - goos: dragonfly
        goarch: mips64le
      - goos: dragonfly
        goarch: riscv64
      - goos: dragonfly
        goarch: s390x
      - goos: dragonfly
        goarch: loong64
      # illumos only targets amd64
      - goos: illumos
        goarch: arm64
      - goos: illumos
        goarch: "386"
      - goos: illumos
        goarch: arm
      - goos: illumos
        goarch: ppc64
      - goos: illumos
        goarch: ppc64le
      - goos: illumos
        goarch: mips
      - goos: illumos
        goarch: mipsle
      - goos: illumos
        goarch: mips64
      - goos: illumos
        goarch: mips64le
      - goos: illumos
        goarch: riscv64
      - goos: illumos
        goarch: s390x
      - goos: illumos
        goarch: loong64
      # solaris only targets amd64
      - goos: solaris
        goarch: arm64
      - goos: solaris
        goarch: "386"
      - goos: solaris
        goarch: arm
      - goos: solaris
        goarch: ppc64
      - goos: solaris
        goarch: ppc64le
      - goos: solaris
        goarch: mips
      - goos: solaris
        goarch: mipsle
      - goos: solaris
        goarch: mips64
      - goos: solaris
        goarch: mips64le
      - goos: solaris
        goarch: riscv64
      - goos: solaris
        goarch: s390x
      - goos: solaris
        goarch: loong64
      # darwin targets amd64 + arm64 only
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64
      - goos: darwin
        goarch: ppc64le
      - goos: darwin
        goarch: mips
      - goos: darwin
        goarch: mipsle
      - goos: darwin
        goarch: mips64
      - goos: darwin
        goarch: mips64le
      - goos: darwin
        goarch: riscv64
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: loong64
      # netbsd does not support riscv64
      - goos: netbsd
        goarch: riscv64
      # openbsd does not support mips64
      - goos: openbsd
        goarch: mips64

archives:
  - id: omc
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"
    wrap_in_directory: true
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"

release:
  github:
    owner: paepckehh
    name: omc
